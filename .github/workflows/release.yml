name: Release

# Builds the release packages whenever a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
# `workflow_dispatch` produces the same artifacts on demand.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Windows: self contained portable archive.
  # ---------------------------------------------------------------------------
  windows:
    name: Windows x64 portable
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          # libmpv powers the embedded player; the DLL is bundled by the
          # ldd closure pass below. Note: comments must stay outside the
          # block scalar, or pacman receives them as package names.
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-mpv

      - name: Configure
        run: cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Deploy Qt runtime
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/LkPlayer.exe dist/
          windeployqt6 dist/LkPlayer.exe --qmldir qml --no-translations

          # windeployqt only brings Qt's own binaries. Pull in the MinGW runtime
          # and the third-party DLLs it leaves behind (icu, harfbuzz, freetype,
          # glib, ...) and repeat until the closure stops growing.
          for _pass in 1 2 3; do
            find dist \( -name '*.dll' -o -name '*.exe' \) | while read -r f; do
              ldd "$f" 2>/dev/null | grep -o '/ucrt64/bin/[^ ]*' || true
            done | sort -u | while read -r lib; do
              cp -n "$lib" dist/ || true
            done
          done

          # Prune what the app never uses. The UI hand-rolls its own controls
          # from plain QtQuick primitives, so windeployqt's QuickControls2
          # styles, unused QML modules and debugging plugins are dead weight
          # (~40 MB raw). QtQuick core files, Window, Dialogs and Effects stay.
          # Must run after the ldd closure pass, which would otherwise re-copy
          # these through plugin dependencies (qsvgicon -> Qt6Svg).
          rm -rf dist/qml/QtQuick/Controls dist/qml/QtQuick/Templates \
                 dist/qml/QtQuick/Layouts dist/qml/QtQuick/NativeStyle \
                 dist/qml/QtQuick/Particles dist/qml/QtQuick/LocalStorage \
                 dist/qml/QtQuick/VectorImage dist/qml/QtQuick/Shapes \
                 dist/qml/QtQuick/tooling dist/qmltooling dist/generic \
                 dist/networkinformation dist/iconengines \
                 dist/imageformats/qsvg.dll dist/Qt6Svg.dll
          # Root-level QuickControls2 style libraries: windeployqt copies the
          # Controls QML plugin tree first and the ldd closure pass then pulls
          # every style it imports to the dist root. Nothing uses styles any
          # more; QtQuick.Dialogs only needs QuickControls2Impl + Templates2.
          find dist -maxdepth 1 -name 'Qt6QuickControls2*.dll' \
            ! -name 'Qt6QuickControls2Impl.dll' -delete

          # Without it Qt derives no prefix and reports every QML module as
          # "not installed". windeployqt does not write one for MinGW builds.
          printf '[Paths]\nPrefix = .\nQml2Imports = qml\nPlugins = .\n' > dist/qt.conf

          # Makes the archive keep its settings next to the executable.
          cp assets/portable.txt README.md dist/

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path "dist\*" -DestinationPath "LkPlayer-${{ github.ref_name }}-win64-portable.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LkPlayer-${{ github.ref_name }}-win64-portable
          path: LkPlayer-${{ github.ref_name }}-win64-portable.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: LkPlayer-${{ github.ref_name }}-win64-portable.zip
          generate_release_notes: true

  # ---------------------------------------------------------------------------
  # Linux: .deb (distribution Qt) + AppImage (bundled Qt).
  # Built inside Debian trixie because it is the oldest release that ships the
  # Qt 6.5+ this project requires.
  # ---------------------------------------------------------------------------
  linux:
    name: Linux x64 deb + AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build in Debian trixie
        env:
          # Tag without the leading "v"; falls back to the branch on manual runs.
          LK_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e DEBIAN_FRONTEND=noninteractive \
            -e LK_VERSION="$LK_VERSION" \
            debian:trixie bash -euxo pipefail -c '
            VERSION="${LK_VERSION#v}"
            [ -n "$VERSION" ] || VERSION=0.0.0

            # The QML modules are installed only so linuxdeploy can copy them
            # into the bundle: the packages themselves ship the runtime.
            apt-get update
            apt-get install -y --no-install-recommends \
              build-essential ca-certificates cmake ninja-build pkg-config \
              qt6-base-dev qt6-base-private-dev qt6-declarative-dev \
              qt6-declarative-private-dev qt6-svg-dev \
              qt6-qpa-plugins qt6-svg-plugins \
              qml6-module-qtquick qml6-module-qtquick-controls \
              qml6-module-qtquick-dialogs qml6-module-qtquick-layouts \
              qml6-module-qtquick-templates qml6-module-qtquick-window \
              qml6-module-qtquick-effects qml6-module-qtqml-workerscript \
              qml6-module-qt-labs-folderlistmodel \
              librsvg2-bin file dpkg-dev binutils patchelf wget \
              libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 zstd \
              libmpv-dev

            cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Release \
              -DLKPLAYER_VERSION="$VERSION"
            cmake --build build
            ctest --test-dir build --output-on-failure
            mkdir -p dist

            # --- one bundle, two packages ------------------------------------
            # linuxdeploy collects the Qt runtime, the QML imports and the
            # platform plugins into AppDir/usr and rewrites the RPATHs to be
            # relative ($ORIGIN), so the tree is relocatable. The AppImage and
            # the .deb are then two different wrappers around the same files.
            # The Qt plugin is a separate AppImage that has to sit next to
            # linuxdeploy (on $PATH) or --plugin qt fails with "Could not
            # find plugin: qt". Both are extracted instead of executed
            # because the runner image ships no FUSE.
            rsvg-convert -w 256 assets/lkplayer.svg -o /tmp/lkplayer.png
            export QMAKE=/usr/bin/qmake6
            export QML_SOURCES_PATHS=/src/qml
            # Download into /tmp: linuxdeploy scans the working directory for
            # linuxdeploy-plugin-*.AppImage and executes them directly, which
            # aborts on runners without FUSE. Extracted copies are used
            # instead, reached through the PATH symlink below.
            wget -q -O /tmp/linuxdeploy-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
            wget -q -O /tmp/linuxdeploy-plugin-qt-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
            chmod +x /tmp/linuxdeploy-x86_64.AppImage /tmp/linuxdeploy-plugin-qt-x86_64.AppImage
            # Extract into separate directories: --appimage-extract always
            # creates ./squashfs-root and would otherwise overwrite.
            mkdir -p .tooling/ld .tooling/qt
            (cd .tooling/ld && /tmp/linuxdeploy-x86_64.AppImage --appimage-extract >/dev/null)
            (cd .tooling/qt && /tmp/linuxdeploy-plugin-qt-x86_64.AppImage --appimage-extract >/dev/null)
            ln -sf qt/squashfs-root/AppRun .tooling/linuxdeploy-plugin-qt
            export PATH="$PWD/.tooling:$PATH"
            ./.tooling/ld/squashfs-root/AppRun \
              --appdir AppDir \
              --executable build/lkplayer \
              --desktop-file assets/lkplayer.desktop \
              --icon-file /tmp/lkplayer.png \
              --plugin qt \
              --output appimage
            mv ./*.AppImage "dist/LkPlayer-$VERSION-x86_64.AppImage"

            # --- deb ---------------------------------------------------------
            ROOT=/tmp/debroot
            rm -rf "$ROOT"
            mkdir -p "$ROOT/opt" "$ROOT/usr/bin" \
                     "$ROOT/usr/share/applications" \
                     "$ROOT/usr/share/icons/hicolor/256x256/apps" \
                     "$ROOT/DEBIAN"
            cp -a AppDir/usr "$ROOT/opt/lkplayer"
            cp assets/lkplayer.desktop "$ROOT/usr/share/applications/"
            cp /tmp/lkplayer.png "$ROOT/usr/share/icons/hicolor/256x256/apps/lkplayer.png"

            # The bundle lives outside the default search paths, so /usr/bin
            # holds a launcher instead of the binary itself.
            printf "#!/bin/sh\nexec /opt/lkplayer/bin/lkplayer \"\$@\"\n" > "$ROOT/usr/bin/lkplayer"
            chmod +x "$ROOT/usr/bin/lkplayer"

            # Qt and libmpv are bundled, so the distribution only has to provide
            # the system level libraries. dpkg-shlibdeps resolves those from the
            # ELF dependencies; the `libqt6*` / `libmpv*` entries it also finds
            # are dropped because we ship them ourselves.
            FALLBACK_DEPS="libc6, libstdc++6, libgcc-s1, zlib1g, libglib2.0-0, libgl1, libegl1, libx11-6, libxext6, libxcb1, libxcb-cursor0, libxkbcommon0, libxkbcommon-x11-0, libfontconfig1, libfreetype6, libdbus-1-3"
            DEPS="$(cd "$ROOT" && mkdir -p debian && \
              printf "Source: lkplayer\nPackage: lkplayer\n" > debian/control && \
              dpkg-shlibdeps --ignore-missing-info -O -e opt/lkplayer/bin/lkplayer 2>/dev/null \
                | sed -n "s/^shlibs:Depends=//p" \
                | tr "," "\n" | sed "s/^[[:space:]]*//" \
                | grep -vE "^(libqt6|libmpv)" | paste -sd, -)"
            rm -rf "$ROOT/debian"
            [ -n "$DEPS" ] || DEPS="$FALLBACK_DEPS"

            # printf rather than a heredoc: a control file line that starts with
            # whitespace is a continuation line, which would corrupt the header.
            printf "%s\n" \
              "Package: lkplayer" \
              "Version: $VERSION" \
              "Section: video" \
              "Priority: optional" \
              "Architecture: amd64" \
              "Maintainer: LkPlayer <noreply@example.com>" \
              "Homepage: https://github.com/lakeluke/LkPlayer" \
              "Depends: $DEPS" \
              "Description: Local media library player built on Qt Quick and libmpv" \
              " Scans a media folder recursively and shows it as a poster grid." \
              " Bundles the Qt runtime and libmpv, so neither is required from the distribution." \
              > "$ROOT/DEBIAN/control"
            cat "$ROOT/DEBIAN/control"
            dpkg-deb --build --root-owner-group "$ROOT" "dist/lkplayer_${VERSION}_amd64.deb"
          '

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LkPlayer-${{ github.ref_name }}-linux
          path: dist/*

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.AppImage
          generate_release_notes: true
