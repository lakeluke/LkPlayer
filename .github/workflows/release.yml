name: Release

# Builds the release packages whenever a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
# `workflow_dispatch` produces the same artifacts on demand.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Windows: self contained portable archive.
  # ---------------------------------------------------------------------------
  windows:
    name: Windows x64 portable
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-svg

      - name: Configure
        run: cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Deploy Qt runtime
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/LkPlayer.exe dist/
          windeployqt6 dist/LkPlayer.exe --qmldir qml --no-translations

          # windeployqt only brings Qt's own binaries. Pull in the MinGW runtime
          # and the third-party DLLs it leaves behind (icu, harfbuzz, freetype,
          # glib, ...) and repeat until the closure stops growing.
          for _pass in 1 2 3; do
            find dist \( -name '*.dll' -o -name '*.exe' \) | while read -r f; do
              ldd "$f" 2>/dev/null | grep -o '/ucrt64/bin/[^ ]*' || true
            done | sort -u | while read -r lib; do
              cp -n "$lib" dist/ || true
            done
          done

          # Without it Qt derives no prefix and reports every QML module as
          # "not installed". windeployqt does not write one for MinGW builds.
          printf '[Paths]\nPrefix = .\nQml2Imports = qml\nPlugins = .\n' > dist/qt.conf

          # Makes the archive keep its settings next to the executable.
          cp assets/portable.txt README.md dist/

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path "dist\*" -DestinationPath "LkPlayer-${{ github.ref_name }}-win64-portable.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LkPlayer-${{ github.ref_name }}-win64-portable
          path: LkPlayer-${{ github.ref_name }}-win64-portable.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: LkPlayer-${{ github.ref_name }}-win64-portable.zip
          generate_release_notes: true

  # ---------------------------------------------------------------------------
  # Linux: .deb (distribution Qt) + AppImage (bundled Qt).
  # Built inside Debian trixie because it is the oldest release that ships the
  # Qt 6.5+ this project requires.
  # ---------------------------------------------------------------------------
  linux:
    name: Linux x64 deb + AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build in Debian trixie
        env:
          # Tag without the leading "v"; falls back to the branch on manual runs.
          LK_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e DEBIAN_FRONTEND=noninteractive \
            -e LK_VERSION="$LK_VERSION" \
            debian:trixie bash -euxo pipefail -c '
            VERSION="${LK_VERSION#v}"
            [ -n "$VERSION" ] || VERSION=0.0.0

            apt-get update
            apt-get install -y --no-install-recommends \
              build-essential ca-certificates cmake ninja-build pkg-config \
              qt6-base-dev qt6-declarative-dev qt6-svg-dev \
              qt6-qpa-plugins qt6-svg-plugins \
              qml6-module-qtquick qml6-module-qtquick-controls \
              qml6-module-qtquick-dialogs qml6-module-qtquick-layouts \
              qml6-module-qtquick-templates qml6-module-qtquick-window \
              qml6-module-qtquick-effects qml6-module-qtqml-workerscript \
              qml6-module-qt-labs-folderlistmodel \
              librsvg2-bin file dpkg-dev binutils patchelf wget \
              libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 zstd

            cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr -DLKPLAYER_VERSION="$VERSION"
            cmake --build build
            ctest --test-dir build --output-on-failure

            # --- deb ---------------------------------------------------------
            mkdir -p dist
            cpack --config build/CPackConfig.cmake -B dist

            # --- AppImage ----------------------------------------------------
            # linuxdeploy bundles the Qt runtime plus the QML imports into an
            # AppDir, then turns it into an AppImage.
            rsvg-convert -w 256 assets/lkplayer.svg -o /tmp/lkplayer.png
            export QMAKE=/usr/bin/qmake6
            export QML_SOURCES_PATHS=/src/qml
            wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
            chmod +x linuxdeploy-x86_64.AppImage
            ./linuxdeploy-x86_64.AppImage --appimage-extract >/dev/null
            ./squashfs-root/AppRun \
              --appdir AppDir \
              --executable build/lkplayer \
              --desktop-file assets/lkplayer.desktop \
              --icon-file /tmp/lkplayer.png \
              --plugin qt \
              --output appimage
            mv ./*.AppImage "dist/LkPlayer-$VERSION-x86_64.AppImage"
          '

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LkPlayer-${{ github.ref_name }}-linux
          path: dist/*

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.AppImage
          generate_release_notes: true
